name: Huddle verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  server-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y build-essential bison flex zstd libcurl4t64 libssl3t64
      - uses: actions/cache@v4
        with:
          path: |
            output/runtime/postgresql-source-18.6
            output/runtime/mysql-binary-8.4.13
            output/runtime/mongodb-fixture-8.0.38
          key: host-databases-pg18.6-555610c24d53-mysql8.4.13-5dfbb764f731-aio-e746fdedefa9-mongo8.0.38-2885d4382bd4-ubuntu-24.04-${{ runner.arch }}
      - run: pnpm fixtures:postgres && pnpm fixtures:mysql && pnpm fixtures:mongodb
      - run: pnpm test:matrix
        env:
          HUDDLE_TEST_PG_BIN: ${{ github.workspace }}/output/runtime/postgresql-source-18.6/bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huddle-server-matrix
          path: output/server-matrix
          if-no-files-found: ignore
  mongodb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y libcurl4t64 libssl3t64
      - uses: actions/cache@v4
        with:
          path: output/runtime/mongodb-fixture-8.0.38
          key: mongodb-binary-8.0.38-2885d4382bd4-ubuntu-24.04-${{ runner.arch }}
      - run: pnpm fixtures:mongodb
      - run: pnpm test:storage:mongodb
      - run: pnpm build
      - run: pnpm test:package:mongodb
  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: output/runtime/mysql-binary-8.4.13
          key: mysql-binary-8.4.13-5dfbb764f731-aio-e746fdedefa9-ubuntu-24.04-${{ runner.arch }}
      - run: pnpm fixtures:mysql
      - run: pnpm test:storage:mysql
      - run: pnpm build
      - run: pnpm test:package:mysql
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y build-essential bison flex
      - uses: actions/cache@v4
        with:
          path: output/runtime/postgresql-source-18.6
          key: postgres-source-18.6-555610c24d53-ubuntu-24.04-${{ runner.arch }}
      - run: pnpm fixtures:postgres
      - run: pnpm test:storage:postgres
        env:
          HUDDLE_TEST_PG_BIN: ${{ github.workspace }}/output/runtime/postgresql-source-18.6/bin
      - run: pnpm build
      - run: pnpm test:package:postgres
        env:
          HUDDLE_TEST_PG_BIN: ${{ github.workspace }}/output/runtime/postgresql-source-18.6/bin
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:next
      - run: pnpm build:frameworks
      - run: pnpm check:bundle
      - run: pnpm test:package
      - run: pnpm test:package:http
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm exec playwright test
      - run: pnpm test:docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huddle-verification
          path: |
            output/browser
            output/docker
            playwright-report
            test-results
          if-no-files-found: ignore
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench:load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huddle-load
          path: output/load
