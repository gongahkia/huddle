services:
  huddle:
    build: .
    ports:
      - "127.0.0.1:${HUDDLE_PORT:-4310}:4310"
    environment:
      HUDDLE_BASE_URL: "${HUDDLE_BASE_URL:-http://localhost:4310}"
      HUDDLE_DATABASE: /data/huddle.sqlite
    volumes:
      - huddle-data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
volumes:
  huddle-data:
